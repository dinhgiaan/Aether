name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # cần để đăng release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-xcodegen-${{ runner.os }}-${{ runner.arch }}

      - name: Cài XcodeGen và sinh project
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild -project Aether.xcodeproj -scheme Aether \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Aether.app Payload/
          zip -qry Aether.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Aether-ipa
          path: Aether.ipa

      # Release "latest" luôn trỏ tới bản mới nhất, tải thẳng từ Safari trên iPhone
      - name: Đăng release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Aether.ipa --title "Aether (latest)" --notes "Build tự động từ commit ${GITHUB_SHA::7}"
