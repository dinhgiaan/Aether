# Tên sản phẩm: "YouTube: Block Ads by Kato" (hiển thị dưới icon: "YouTube").
# Codename cũ "Aether" chỉ còn ở bundle ID (giữ nguyên để LiveContainer không coi là app mới và mất dữ liệu đã tải).
name: YouTubeKato
options:
  bundleIdPrefix: com.dinhgiaan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  YouTubeKato:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: YouTube          # giữ ≤ 12 ký tự để iOS không cắt tên dưới icon
        CFBundleShortVersionString: "2.0.0"
        UIBackgroundModes: [audio]            # phát nhạc/video khi khóa màn hình
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark            # app thiết kế nền tối: launch screen hết trắng, WKWebView báo prefers-color-scheme: dark
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinhgiaan.aether
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon